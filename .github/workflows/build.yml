name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - run: gradle clean build --no-daemon --stacktrace
      - name: Validate plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          jars=(build/libs/*.jar)
          test "${#jars[@]}" -eq 1
          jar="${jars[0]}"
          unzip -l "$jar" | grep -Fq 'plugin.yml'
          unzip -l "$jar" | grep -Fq 'com/uop/recordingtools/UopRecordingToolsPlugin.class'
          unzip -p "$jar" plugin.yml | grep -Fq 'api-version: '\''1.21.11'\'''
          unzip -p "$jar" plugin.yml | grep -Fq 'main: com.uop.recordingtools.UopRecordingToolsPlugin'
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: uop-recording-tools-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
